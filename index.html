<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V9 Signature Fixed</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; }
.app-navbar { background: linear-gradient(135deg, #1c4587 0%, #120b2e 100%); color: white; padding: 12px 20px; position: sticky; top: 0; z-index: 1050; }
.app-card { background: #fff; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); margin-bottom: 20px; }
.table-container-app { max-height: 65vh; overflow-y: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
.table-app th { background: #120b2e; color: white; text-align: center; position: sticky; top: 0; }
.table-app td { text-align: center; padding: 8px; }
.select-name { border-radius: 20px; padding: 4px 12px; font-weight: 600; font-size: 0.85rem; }
.badge-person { padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 0.84rem; display: inline-block; }
.btn-app-action { border-radius: 10px; font-weight: 600; padding: 8px 16px; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; }
.status-toast { position: fixed; bottom: 20px; right: 20px; z-index: 9999; border-radius: 12px; padding: 12px 20px; color: white; font-weight: 600; }
.manual-badge { background: #ff9800; color: #000; font-weight: 700; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%{opacity:1} 50%{opacity:0.6} 100%{opacity:1} }
</style>
</head>
<body>
<nav class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
<div style="font-weight:700; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-shield-halved text-warning"></i> V9 ยศหน้าเส้นประ <span id="manualModeBadge" class="badge manual-badge d-none ms-2">โหมดแก้ไขเอง</span></div>
<div class="d-flex align-items-center gap-2 flex-wrap">
<select id="monthSelect" class="form-select form-select-sm fw-bold" style="width:auto;" onchange="calculateNewRoster()">
<option value="9">กันยายน 2026</option><option value="10" selected>ตุลาคม 2026</option><option value="11">พฤศจิกายน 2026</option><option value="12">ธันวาคม 2026</option>
</select>
<button class="btn btn-sm btn-light text-primary btn-app-action" onclick="calculateNewRoster()">รีเฟรช</button>
<button class="btn btn-sm btn-warning text-dark fw-bold btn-app-action" onclick="generateNewRosterConfirm()">จัดใหม่</button>
<button class="btn btn-sm btn-danger btn-app-action" onclick="exportDailyPDF()">ส่งออก PDF รายวัน</button>
<button class="btn btn-sm btn-success btn-app-action" onclick="saveToGoogleSheet()">บันทึก</button>
</div>
</nav>

<div class="container-fluid py-3 px-3">
<div class="app-card p-3 border-start border-4 border-primary mb-3">
<p class="mb-0 small text-muted" id="lblSyncStatus">กำลังเชื่อมโยง...</p>
</div>
<div class="row g-3">
<div class="col-xl-7"><div class="app-card p-3"><h5 class="fw-bold text-primary mb-3">ตารางปฏิบัติหน้าที่</h5><div class="table-container-app"><table class="table table-bordered table-hover table-app"><thead><tr><th>วันที่</th><th>วัน</th><th>ร้อยเวรหลัก</th><th>ผู้ช่วย 1</th><th>ผู้ช่วย 2</th><th>เวรนอน</th></tr></thead><tbody id="dutyBody"></tbody></table></div></div></div>
<div class="col-xl-5"><div class="app-card p-3"><h6 class="fw-bold text-primary mb-2">สรุปภาระงาน</h6><div class="table-responsive" style="max-height:300px; overflow-y:auto;"><table class="table table-striped table-bordered table-app mb-0"><thead class="table-dark"><tr><th>รายชื่อ</th><th>เวรหลัก</th><th>ผู้ช่วย</th><th>เวรนอน</th><th>รวม</th></tr></thead><tbody id="summaryBody"></tbody></table></div></div></div>
</div>
</div>

<div id="toastAlert" class="status-toast bg-success d-none"><span id="toastMessage">สำเร็จ!</span></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbytgfbaxtHeS5uPWAwzjHVCjIukBNFAyTFqSwolW5ibIRcXJUmm8gIw9PWKipN4E9swTA/exec";
var currentData = null;
var isManualMode = false;
var listMainOfficers = ["พ.ต.ท.หญิง พัชรี", "พ.ต.ท.หญิง อลิษา", "พ.ต.ต.หญิง พัชราภรณ์", "ร.ต.ท.กิตติศักดิ์", "พ.ต.ต.พรพิมล", "ร.ต.อ.นัสรอน", "ร.ต.ท.รณชัช"];
var listAsst1 = ["ร.ต.ต.พรณรงค์", "ว่าที่ ร.ต.ต.สุริยา", "จ.ส.ต.ปิติพงษ์"];
var listAsst2 = ["ด.ต.หญิง ธมนวรรณ"].concat(listMainOfficers);
var listSleep = ["ร.ต.ต.พรณรงค์", "ว่าที่ ร.ต.ต.สุริยา", "จ.ส.ต.ปิติพงษ์", "ด.ต.หญิง ธมนวรรณ"];
var assistantSet1 = ["พ.ต.ท.หญิง พัชรี", "พ.ต.ท.หญิง อลิษา", "พ.ต.ต.หญิง พัชราภรณ์", "ร.ต.ท.กิตติศักดิ์", "พ.ต.ต.พรพิมล", "ร.ต.อ.นัสรอน", "ร.ต.ท.รณชัช", "ด.ต.หญิง ธมนวรรณ"];
var assistantSet2 = ["ร.ต.ต.พรณรงค์", "ว่าที่ ร.ต.ต.สุริยา", "จ.ส.ต.ปิติพงษ์"];
var colorMap = {"พ.ต.ท.หญิง พัชรี": { bg: "#fce5cd", text: "#783f04" },"พ.ต.ท.หญิง อลิษา": { bg: "#ead1dc", text: "#4c1130" },"พ.ต.ต.หญิง พัชราภรณ์": { bg: "#fff2cc", text: "#7f6000" },"ร.ต.ท.กิตติศักดิ์": { bg: "#f4ccd3", text: "#741b47" },"พ.ต.ต.พรพิมล": { bg: "#d9ead3", text: "#274e13" },"ร.ต.อ.นัสรอน": { bg: "#c9daf8", text: "#1c4587" },"ร.ต.ท.รณชัช": { bg: "#d9d2e9", text: "#20124d" },"ร.ต.ต.พรณรงค์": { bg: "#d0e0e3", text: "#134f5c" },"ว่าที่ ร.ต.ต.สุริยา": { bg: "#f5e5d3", text: "#5b3f11" },"จ.ส.ต.ปิติพงษ์": { bg: "#e1d5e7", text: "#351c75" },"ด.ต.หญิง ธมนวรรณ": { bg: "#efefef", text: "#434343" }};
var rankScore = {"พ.ต.ท.หญิง พัชรี": 100, "พ.ต.ท.หญิง อลิษา": 100,"พ.ต.ต.หญิง พัชราภรณ์": 90, "พ.ต.ต.พรพิมล": 90,"ร.ต.อ.นัสรอน": 80, "ร.ต.ท.กิตติศักดิ์": 70, "ร.ต.ท.รณชัช": 70,"ร.ต.ต.พรณรงค์": 60, "ว่าที่ ร.ต.ต.สุริยา": 55, "ด.ต.หญิง ธมนวรรณ": 40, "จ.ส.ต.ปิติพงษ์": 30};
function getRankOnly(fullName){
  if(fullName.startsWith("ว่าที่ พ.ต.ต.")) return "ว่าที่ พ.ต.ต.";
  if(fullName.startsWith("ว่าที่ ร.ต.ต.")) return "ว่าที่ ร.ต.ต.";
  if(fullName.startsWith("พ.ต.ท.หญิง")) return "พ.ต.ท.หญิง";
  if(fullName.startsWith("พ.ต.ต.หญิง")) return "พ.ต.ต.หญิง";
  if(fullName.startsWith("ด.ต.หญิง")) return "ด.ต.หญิง";
  if(fullName.startsWith("พ.ต.ท.")) return "พ.ต.ท.";
  if(fullName.startsWith("พ.ต.ต.")) return "พ.ต.ต.";
  if(fullName.startsWith("ร.ต.อ.")) return "ร.ต.อ.";
  if(fullName.startsWith("ร.ต.ท.")) return "ร.ต.ท.";
  if(fullName.startsWith("ร.ต.ต.")) return "ร.ต.ต.";
  if(fullName.startsWith("จ.ส.ต.")) return "จ.ส.ต.";
  if(fullName.startsWith("ด.ต.")) return "ด.ต.";
  return fullName.split(" ")[0];
}
window.onload = function(){ calculateNewRoster(); };
function showToast(msg, isError){ var t=document.getElementById("toastAlert"); document.getElementById("toastMessage").innerText=msg; t.className="status-toast "+(isError?"bg-danger":"bg-success"); t.classList.remove("d-none"); setTimeout(()=>t.classList.add("d-none"),3000); }
function renderBadge(name){ var s=colorMap[name]||{bg:"#e0e0e0",text:"#000"}; return `<span class="badge-person" style="background:${s.bg};color:${s.text}">${name}</span>`; }
async function calculateNewRoster(){
  var month=parseInt(document.getElementById("monthSelect").value);
  try{
    let res=await fetch(`${GAS_API_URL}?action=getRoster&year=2026&month=${month}`);
    let data=await res.json();
    currentData=data; isManualMode=false; document.getElementById("manualModeBadge").classList.add("d-none");
    if(!currentData.lockedFixes) currentData.lockedFixes={};
    renderWebPage(); 
    document.getElementById("lblSyncStatus").innerHTML=data.isFromSheet?"<b class='text-success'>เชื่อมโยงสมบูรณ์</b>":"<b class='text-primary'>ข้อมูลใหม่ยังไม่ได้บันทึก</b>";
  }catch(e){ alert("โหลดไม่ได้: "+e); }
}
async function generateNewRosterConfirm(){ if(!confirm("ล้างและจัดใหม่ทั้งหมด?")) return; var month=parseInt(document.getElementById("monthSelect").value); let r=await fetch(`${GAS_API_URL}?action=generateNewRoster&year=2026&month=${month}`); let d=await r.json(); currentData=d; isManualMode=false; document.getElementById("manualModeBadge").classList.add("d-none"); currentData.lockedFixes={}; renderWebPage(); showToast("จัดใหม่เรียบร้อย"); }
function renderWebPage(){
  if(!currentData) return;
  var dHtml=""; currentData.roster.forEach((row, idx)=>{
    dHtml+=`<tr><td><b>${row.day}</b></td><td>${row.dayName}</td><td>${createDropdown(idx,'main',row.main,listMainOfficers)}</td><td>${createDropdown(idx,'asst1',row.asst1,listAsst1)}</td><td>${createDropdown(idx,'asst2',row.asst2,listAsst2)}</td><td>${createDropdown(idx,'sleep',row.sleep,listSleep)}</td></tr>`;
  }); document.getElementById("dutyBody").innerHTML=dHtml; renderSummaryTable();
}
function createDropdown(ri, ct, sel, list){ var st=colorMap[sel]||{bg:"#fff",text:"#000"}; var h=`<select class="form-select select-name" style="background:${st.bg};color:${st.text}" onchange="updateDutyPerson(${ri},'${ct}',this.value,this)">`; list.forEach(n=>{ h+=`<option value="${n}" ${n===sel?"selected":""}>${n}</option>`; }); h+=`</select>`; return h; }
function updateDutyPerson(ri, ct, newName, el){
  isManualMode=true; document.getElementById("manualModeBadge").classList.remove("d-none"); if(!currentData.lockedFixes) currentData.lockedFixes={};
  currentData.roster[ri][ct]=newName; if(ct==='main') currentData.lockedFixes["fixed_main_"+currentData.roster[ri].day]=newName;
  var st=colorMap[newName]||{bg:"#fff",text:"#000"}; el.style.backgroundColor=st.bg; el.style.color=st.text;
  renderSummaryTable();
}
function renderSummaryTable(){ var h=""; currentData.summary.forEach(s=>{ h+=`<tr><td>${renderBadge(s.name)}</td><td>${s.main} วัน</td><td>${s.asst} วัน</td><td>${s.sleep} วัน</td><td><b class="text-primary">${s.total} วัน</b></td></tr>`; }); document.getElementById("summaryBody").innerHTML=h; }
async function saveToGoogleSheet(){ if(!currentData) return; try{ let r=await fetch(GAS_API_URL,{method:'POST',body:JSON.stringify({action:'saveRoster',finalData:currentData})}); let res=await r.json(); isManualMode=false; document.getElementById("manualModeBadge").classList.add("d-none"); currentData.lockedFixes={}; showToast(res.message); }catch(e){ alert("บันทึกไม่ได้: "+e); } }

const THAI_MONTHS = ["", "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
const THAI_DIGITS = ["๐","๑","๒","๓","๔","๕","๖","๗","๘","๙"];
function toThaiDigits(s){ return s.toString().split('').map(c=>{ let n=parseInt(c); return isNaN(n)?c:THAI_DIGITS[n]; }).join(''); }
function formatThaiDate(day, month, year){ return `${toThaiDigits(day)} ${THAI_MONTHS[month]} ${toThaiDigits(year+543)}`; }
function expandRank(fullName){
  let map = {"ร.ต.ต.พรณรงค์": "ว่าที่ ร.ต.ต.พรณรงค์ คงนคร","ว่าที่ ร.ต.ต.สุริยา": "ด.ต.สุริยา หมั่นทวี","จ.ส.ต.ปิติพงษ์": "ด.ต.วัยทิพย์ ตั้นฉ้วน","ด.ต.หญิง ธมนวรรณ": "ด.ต.หญิง ธมนวรรณ ศรีเพ็ชร","พ.ต.ท.หญิง พัชรี": "พ.ต.ท.หญิง พัชรี ศรีธัญรัตน์","พ.ต.ต.พรพิมล": "ว่าที่ พ.ต.ต.พรพิมล คงชัย"};
  return map[fullName] || fullName;
}

function exportDailyPDF(){
  if(!currentData || !currentData.roster){ alert("ไม่มีข้อมูลเวร"); return; }
  let year = currentData.year; let month = currentData.month;
  let html = `<html><head><meta charset="utf-8">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
      @page { size: A4; margin: 15mm 18mm 12mm 18mm; }
      body { font-family: 'TH Sarabun New', 'Sarabun', sans-serif; font-size: 16pt; line-height: 1.35; color: #000; margin:0; }
      .page { width: 210mm; height: 297mm; margin: 0 auto; padding: 12mm 18mm 10mm 18mm; box-sizing: border-box; page-break-after: always; position: relative; display: flex; flex-direction: column; }
      .page:last-child { page-break-after: avoid; }
      .content { flex: 1; }
      .header { text-align: center; font-size: 18pt; font-weight: bold; margin-bottom: 8pt; }
      .subheader { font-size: 15pt; }
      .field { margin-top: 6pt; font-size: 15pt; }
      .dotted { border-bottom: 1px dotted #000; display: inline-block; min-width: 160px; padding: 0 5px; }
      .dotted-long { min-width: 260px; }
      .dotted-date { min-width: 190px; }
      .dotted-time { min-width: 70px; }
      .team { margin-top: 12pt; }
      .team-title { font-weight: bold; font-size: 15pt; margin-bottom: 4pt; }
      .team-list { margin-left: 20pt; line-height: 1.8; font-size: 15pt; }
      .role-tag { font-size: 11pt; color: #444; margin-left: 8pt; }
      .report { margin-top: 12pt; font-size: 14.5pt; line-height: 1.5; }
      .report ol { margin: 4pt 0 4pt 18pt; padding: 0; }
      .signature { margin-top: 18pt; font-size: 15pt; line-height: 2.3; }
      .sig-line { display: inline-block; border-bottom: 1px dotted #000; width: 300px; margin: 0 8px; }
      .footer { text-align: center; font-size: 9.5pt; border-top: 1px dashed #999; padding-top: 4pt; margin-top: auto; }
      .single-line { border-bottom: 1px dotted #000; display: inline-block; width: 140px; margin: 0 4px; }
    </style></head><body>`;

  currentData.roster.forEach((row, idx)=>{
    let thaiDate = formatThaiDate(row.day, month, year);
    let team1 = [row.main, row.asst1, row.sleep];
    let team1Set = new Set(team1);
    let mainCandidates = listMainOfficers.filter(n => !team1Set.has(n));
    if(mainCandidates.length === 0) mainCandidates = listMainOfficers.filter(n => n !== row.main);
    mainCandidates.sort((a,b) => (rankScore[b]||0) - (rankScore[a]||0));
    let team2_p1 = mainCandidates[0] || listMainOfficers[0];
    let excludedForP2 = new Set([...team1, team2_p1]);
    let set1Candidates = assistantSet1.filter(n => !excludedForP2.has(n) && n !== row.main);
    set1Candidates.sort((a,b) => (rankScore[b]||0) - (rankScore[a]||0));
    let team2_p2 = set1Candidates[0];
    let excludedForP3 = new Set([...team1, team2_p1, team2_p2]);
    let set2Candidates = assistantSet2.filter(n => !excludedForP3.has(n));
    set2Candidates.sort((a,b) => (rankScore[b]||0) - (rankScore[a]||0));
    let team2_p3 = set2Candidates[0];
    if(!team2_p2){ let fb = assistantSet1.filter(n => !excludedForP2.has(n)); fb.sort((a,b)=>(rankScore[b]||0)-(rankScore[a]||0)); team2_p2 = fb[0] || assistantSet1[0]; }
    if(!team2_p3){ let fb2 = assistantSet2.filter(n => n !== team2_p2 && !team1Set.has(n)); team2_p3 = fb2[0] || assistantSet2[0]; }
    let team2 = [team2_p1, team2_p2, team2_p3];
    let rankOnly1 = getRankOnly(row.main);
    let rankOnly2 = getRankOnly(team2_p1);

    html += `
      <div class="page">
        <div class="content">
          <div class="header">การรายงานความพร้อมด้านการตรวจสถานที่เกิดเหตุ</div>
          <div class="subheader">แบบการตรวจจำนวนและความพร้อมของเจ้าหน้าที่ตรวจสถานที่เกิดเหตุ</div>
          <div class="field">หน่วยงาน <span class="dotted dotted-long">พิสูจน์หลักฐานจังหวัดตรัง</span></div>
          <div class="field" style="display:flex; justify-content:space-between;">
            <span>ประจำวันที่ <span class="dotted dotted-date">${thaiDate}</span></span>
            <span>เวลา <span class="dotted dotted-time">${toThaiDigits("08.00")}</span> น.</span>
          </div>
          <div class="team">
            <div class="team-title">ทีมชุดตรวจสถานที่เกิดเหตุ (ชุดที่ ${toThaiDigits(1)})</div>
            <div class="team-list">
              ${toThaiDigits(1)} <span class="dotted dotted-long">${expandRank(team1[0])}</span><br>
              ${toThaiDigits(2)} <span class="dotted dotted-long">${expandRank(team1[1])}</span><br>
              ${toThaiDigits(3)} <span class="dotted dotted-long">${expandRank(team1[2])}</span>
            </div>
          </div>
          <div class="team">
            <div class="team-title">ทีมชุดตรวจสถานที่เกิดเหตุ (ชุดที่ ${toThaiDigits(2)})</div>
            <div class="team-list">
              ${toThaiDigits(1)} <span class="dotted dotted-long">${expandRank(team2[0])}</span> <span class="role-tag">(ร้อยเวร)</span><br>
              ${toThaiDigits(2)} <span class="dotted dotted-long">${expandRank(team2[1])}</span> <span class="role-tag">(ผู้ช่วย ๑)</span><br>
              ${toThaiDigits(3)} <span class="dotted dotted-long">${expandRank(team2[2])}</span> <span class="role-tag">(ผู้ช่วย ๒)</span>
            </div>
          </div>
          <div class="report">
            <div>ข้าพเจ้า <span class="dotted">${expandRank(row.main)}</span> ปฏิบัติหน้าที่เวรตรวจสถานที่เกิดเหตุ ขอรายงาน ดังนี้</div>
            <ol>
              <li>ตรวจความพร้อมกำลังพล เครื่องแต่งกาย (ชุดปฏิบัติการฯ) และทรงผม</li>
              <li>ตรวจความพร้อมเครื่องมือ/อุปกรณ์กระเป๋าตรวจสถานที่เกิดเหตุ และยานพาหนะ</li>
              <li>ตรวจความพร้อมอุปกรณ์ป้องกันการแพร่ระบาดของเชื้อไวรัส โควิด-๑๙ เช่นหน้ากากอนามัย เจลล้างมือ แอลกอฮอล์ เป็นต้น</li>
            </ol>
            <div style="margin-left:16pt;">
              ผลการดำเนินการ เครื่องแต่งกาย ทรงผมเป็นไปด้วยความเรียบร้อย เจ้าหน้าที่ชุดตรวจฯ เข้าใจและรับทราบการปฏิบัติหน้าที่ <span class="single-line"></span> การตรวจสถานที่เกิดเหตุ
            </div>
            <div style="margin-top:10pt;">จึงเรียนมาเพื่อโปรดทราบ</div>
          </div>
          <div class="signature">
            ลงชื่อ ${rankOnly1} <span class="sig-line"></span> หัวหน้าทีมตรวจสถานที่เกิดเหตุ (ชุดที่ ${toThaiDigits(1)})<br>
            ลงชื่อ ${rankOnly2} <span class="sig-line"></span> หัวหน้าทีมตรวจสถานที่เกิดเหตุ (ชุดที่ ${toThaiDigits(2)})<br>
            ลงชื่อ พ.ต.อ. <span class="sig-line"></span> ผู้ควบคุมชุดปฏิบัติการ
          </div>
        </div>
        <div class="footer">** พร้อมแนบภาพถ่ายชุดปฏิบัติการและการเตรียมความพร้อมตามเอกสารแนบ - วันที่ ${row.day}/${month}/${year} (${row.dayName})</div>
      </div>`;
  });
  html += `</body></html>`;
  let w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 800);
  showToast(`สร้าง PDF ${currentData.roster.length} หน้า - ยศหน้าเส้นประ`);
}
</script>
</body>
</html>
